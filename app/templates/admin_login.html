{% extends "base.html" %}
{% block title %}Admin login — bounding-box{% endblock %}
{% block body %}
<section class="max-w-sm mx-auto pt-8">
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm p-6">
    <h1 class="text-xl font-bold tracking-tight text-slate-900">Admin login</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to manage history.</p>

    {% if error %}
    <div class="mt-4 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
      {{ error }}
    </div>
    {% endif %}

    <form action="{{ prefix }}/admin/login" method="post" class="mt-5 space-y-4">
      <div>
        <label for="password" class="sr-only">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autofocus
          autocomplete="current-password"
          placeholder="Password"
          class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <button
        type="submit"
        class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        Sign in
      </button>
    </form>
  </div>
</section>
{% endblock %}
